/* ============================= POLYFILL DE STORAGE ============================= */
if (!window.storage) {
  if (SUPABASE_URL && SUPABASE_ANON_KEY && typeof supabase !== 'undefined') {
    console.log("Tree Test: Usando base de datos Supabase en la nube");
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    window.storage = {
      async get(key) {
        try {
          const { data, error } = await supabaseClient
            .from('tree_test_storage')
            .select('value')
            .eq('key', key)
            .maybeSingle();
          
          if (error) throw error;
          return data ? { value: data.value } : null;
        } catch (e) {
          console.error("Supabase GET error, usando fallback de localStorage:", e);
          const val = localStorage.getItem(key);
          return val ? { value: val } : null;
        }
      },
      async set(key, value) {
        try {
          const { error } = await supabaseClient
            .from('tree_test_storage')
            .upsert({ key, value });
          if (error) throw error;
        } catch (e) {
          console.error("Supabase SET error, guardando en localStorage:", e);
          localStorage.setItem(key, value);
        }
      },
      async list(prefix) {
        try {
          const { data, error } = await supabaseClient
            .from('tree_test_storage')
            .select('key')
            .like('key', `${prefix}%`);
          
          if (error) throw error;
          return { keys: (data || []).map(item => item.key) };
        } catch (e) {
          console.error("Supabase LIST error, listando de localStorage:", e);
          const keys = [];
          for (let i = 0; i < localStorage.length; i++) {
            const k = localStorage.key(i);
            if (k && k.startsWith(prefix)) keys.push(k);
          }
          return { keys };
        }
      },
      async delete(key) {
        try {
          const { error } = await supabaseClient
            .from('tree_test_storage')
            .delete()
            .eq('key', key);
          if (error) throw error;
        } catch (e) {
          console.error("Supabase DELETE error, eliminando de localStorage:", e);
          localStorage.removeItem(key);
        }
      }
    };
  } else {
    // Fallback original (Servidor Express local o localStorage)
    const isLocalFile = window.location.protocol === 'file:';
    if (isLocalFile) {
      console.log("Tree Test: Usando fallback de localStorage (modo archivo local)");
      window.storage = {
        async get(key) {
          const val = localStorage.getItem(key);
          return val ? { value: val } : null;
        },
        async set(key, value) {
          localStorage.setItem(key, value);
        },
        async list(prefix) {
          const keys = [];
          for (let i = 0; i < localStorage.length; i++) {
            const k = localStorage.key(i);
            if (k && k.startsWith(prefix)) keys.push(k);
          }
          return { keys };
        },
        async delete(key) {
          localStorage.removeItem(key);
        }
      };
    } else {
      console.log("Tree Test: Usando API del servidor local");
      window.storage = {
        async get(key) {
          try {
            const res = await fetch(`/api/storage?key=${encodeURIComponent(key)}`);
            if (res.status === 404) return null;
            if (!res.ok) throw new Error();
            return await res.json();
          } catch (e) {
            const val = localStorage.getItem(key);
            return val ? { value: val } : null;
          }
        },
        async set(key, value) {
          try {
            const res = await fetch('/api/storage', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ key, value })
            });
            if (!res.ok) throw new Error();
          } catch (e) {
            localStorage.setItem(key, value);
          }
        },
        async list(prefix) {
          try {
            const res = await fetch(`/api/storage/list?prefix=${encodeURIComponent(prefix)}`);
            if (!res.ok) throw new Error();
            const keys = await res.json();
            return { keys };
          } catch (e) {
            const keys = [];
            for (let i = 0; i < localStorage.length; i++) {
              const k = localStorage.key(i);
              if (k && k.startsWith(prefix)) keys.push(k);
            }
            return { keys };
          }
        },
        async delete(key) {
          try {
            const res = await fetch(`/api/storage?key=${encodeURIComponent(key)}`, {
              method: 'DELETE'
            });
            if (!res.ok) throw new Error();
          } catch (e) {
            localStorage.removeItem(key);
          }
        }
      };
    }
  }
}

/* ============================= UTILIDADES ============================= */
function uid(){ return Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4); }
function slugify(s){ return (s||'').toLowerCase().trim().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'') || 'sin-nombre'; }
function findNode(tree, id, path){
  path = path || [];
  for(const n of tree){
    const p = path.concat([n]);
    if(n.id === id) return p;
    if(n.children && n.children.length){
      const found = findNode(n.children, id, p);
      if(found) return found;
    }
  }
  return null;
}
function flattenWithPath(tree, parentPath){
  parentPath = parentPath || [];
  let out = [];
  for(const n of tree){
    const p = parentPath.concat([n]);
    out.push({ id:n.id, node:n, pathNodes:p });
    if(n.children && n.children.length){
      out = out.concat(flattenWithPath(n.children, p));
    }
  }
  return out;
}
function tokenPath(pathNodes){ return pathNodes.map(n=>slugify(n.label)).join('/'); }
function labelPath(pathNodes, sep){ return pathNodes.map(n=>n.label).join(sep||' \u2192 '); }
function escapeHtml(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtSec(ms){ return (ms/1000).toFixed(1)+'s'; }

/* ============================= STORAGE ============================= */
async function loadConfig(){
  try{
    const res = await window.storage.get('tt-config', true);
    if(res && res.value) return JSON.parse(res.value);
  }catch(e){ /* no existe todavía */ }
  return null;
}
async function saveConfigRemote(cfg){
  try{ await window.storage.set('tt-config', JSON.stringify(cfg), true); return true; }
  catch(e){ console.error('saveConfig error', e); return false; }
}
async function saveResultRemote(result){
  try{ await window.storage.set('tt-result:'+result.id, JSON.stringify(result), true); return true; }
  catch(e){ console.error('saveResult error', e); return false; }
}
async function loadAllResults(){
  try{
    const list = await window.storage.list('tt-result:', true);
    if(!list || !list.keys) return [];
    const items = [];
    for(const k of list.keys){
      try{
        const r = await window.storage.get(k, true);
        if(r && r.value) items.push(JSON.parse(r.value));
      }catch(e){ /* skip */ }
    }
    return items;
  }catch(e){ return []; }
}
async function clearAllResults(){
  try{
    let list = await window.storage.list('tt-result:', true);
    let keys = (list && list.keys) ? list.keys : [];
    for(const k of keys){
      try{ await window.storage.delete(k, true); }catch(e){ console.error('delete failed', k, e); }
    }
    // reintento por si alguna key quedó (ej: fallo de red puntual)
    let check = await window.storage.list('tt-result:', true);
    let remaining = (check && check.keys) ? check.keys : [];
    if(remaining.length){
      for(const k of remaining){
        try{ await window.storage.delete(k, true); }catch(e){ console.error('retry delete failed', k, e); }
      }
      check = await window.storage.list('tt-result:', true);
      remaining = (check && check.keys) ? check.keys : [];
    }
    return { ok: remaining.length === 0, remaining: remaining.length };
  }catch(e){
    console.error('clearAllResults error', e);
    return { ok:false, remaining:-1 };
  }
}

async function ensureConfigLoaded(){
  if(state.configLoaded) return;

    state.config = remote;
  }else{
    // no había config guardada, o es una versión vieja (de una nomenclatura anterior): se reemplaza por la actual

/* ============================= TEST — LÓGICA ============================= */
function startTest(participantName){
  state.test = {
    id: uid(),
    participant: participantName || '',
    taskIndex: 0,
    path: [],           // ids desde la raíz para la tarea actual
    backtracks: 0,
    clickCount: 0,
    startTime: Date.now(),
    firstClickId: null,
    perTask: [],         // resultados acumulados
    done:false,
  };
  render();
}

function currentTaskLevel(){
  const t = state.test;
  let level = state.config.tree;
  for(const id of t.path){
    const node = level.find(n => n.id === id);
    if(!node) break;
    level = node.children || [];
  }
  return level;
}
function currentTaskNodePath(){
  const t = state.test;
  const nodes = [];
  let level = state.config.tree;
  for(const id of t.path){
    const node = level.find(n => n.id === id);
    if(!node) break;
    nodes.push(node);
    level = node.children || [];
  }
  return nodes;
}

function drillInto(nodeId){
  const t = state.test;
  if(t.firstClickId === null) t.firstClickId = nodeId;
  t.path.push(nodeId);
  t.clickCount++;
  render();
}
function goBack(){
  const t = state.test;
  if(t.path.length === 0) return;
  t.path.pop();
  t.backtracks++;
  t.clickCount++;
  render();
}

function confirmAnswer(){
  const t = state.test;
  const task = state.config.tasks[t.taskIndex];
  const pathNodes = currentTaskNodePath();
  const finalId = pathNodes.length ? pathNodes[pathNodes.length-1].id : null;
  const durationMs = Date.now() - t.startTime;
  const success = !!finalId && finalId === task.correctNodeId;

  let correctPathNodes = [];
  if(task.correctNodeId){
    const fp = findNode(state.config.tree, task.correctNodeId);
    if(fp) correctPathNodes = fp;
  }
  const firstClickCorrect = correctPathNodes.length && t.firstClickId === correctPathNodes[0].id;

  t.perTask.push({
    taskId: task.id,
    prompt: task.prompt,
    finalNodeId: finalId,
    finalLabelPath: labelPath(pathNodes),
    finalTokenPath: tokenPath(pathNodes),
    correctNodeId: task.correctNodeId,
    correctLabelPath: labelPath(correctPathNodes),
    correctTokenPath: tokenPath(correctPathNodes),
    success,
    firstClickCorrect: !!firstClickCorrect,
    backtracks: t.backtracks,
    clicks: t.clickCount,
    durationMs,
  });

  const nextIndex = t.taskIndex + 1;
  if(nextIndex >= state.config.tasks.length){
    finishTest();
  }else{
    t.taskIndex = nextIndex;
    t.path = [];
    t.backtracks = 0;
    t.clickCount = 0;
    t.firstClickId = null;
    t.startTime = Date.now();
    render();
  }
}

async function finishTest(){
  const t = state.test;
  t.done = true;
  render();
  const record = {
    id: t.id,
    participant: t.participant,
    submittedAt: Date.now(),
    perTask: t.perTask,
  };
  await saveResultRemote(record);
}

/* ============================= RESULTADOS — AGREGACIÓN ============================= */
async function ensureResultsLoaded(force){
  if(state.resultsState.loaded && !force) return;
  state.resultsState.loading = true; render();
  const items = await loadAllResults();
  state.resultsState.items = items;
  state.resultsState.loading = false;
  state.resultsState.loaded = true;
  render();
}

function computeParticipantLabelMap(items){
  const orderedItems = [...items].sort((a,b) => (a.submittedAt||0) - (b.submittedAt||0));
  const nameCounts = {};
  orderedItems.forEach(it => {
    const trimmed = it.participant ? it.participant.trim() : '';
    if(trimmed) nameCounts[trimmed] = (nameCounts[trimmed]||0) + 1;
  });
  const nameSeen = {};
  const map = {};
  orderedItems.forEach((it, idx) => {
    const trimmed = it.participant ? it.participant.trim() : '';
    if(!trimmed){
      map[it.id] = 'Usuario ' + (idx + 1);
    }else if(nameCounts[trimmed] > 1){
      nameSeen[trimmed] = (nameSeen[trimmed]||0) + 1;
      map[it.id] = `${trimmed} (envío ${nameSeen[trimmed]})`;
    }else{
      map[it.id] = trimmed;
    }
  });
  return { map, orderedItems };
}

function statusForAnswer(task, finalNodeId){
  if(!task.correctNodeId) return 'wrong';
  if(finalNodeId === task.correctNodeId) return 'correct';
  if(finalNodeId){
    const correctParent = task.correctNodeId.split('/').slice(0,-1).join('/');
    const candidateParent = finalNodeId.split('/').slice(0,-1).join('/');
    if(candidateParent && candidateParent === correctParent) return 'close';
  }
  return 'wrong';
}

function aggregateResults(){
  const items = state.resultsState.items;
  const { map } = computeParticipantLabelMap(items);
  const tasks = state.config.tasks;
  let overallSuccess = 0, overallN = 0;
  items.forEach(it => (it.perTask||[]).forEach(pt => {
    const task = tasks.find(t => t.id === pt.taskId);
    if(!task) return;
    overallN++;
    if(pt.success) overallSuccess++;
  }));
  return { totalParticipants: items.length, overallRate: overallN ? overallSuccess/overallN : 0, labelMap: map };
}

function buildParticipantSummaries(){
  const items = state.resultsState.items;
  const tasks = state.config.tasks;
  const { map, orderedItems } = computeParticipantLabelMap(items);
  return orderedItems.map(it => {
    const rows = tasks.map((task, idx) => {
      const pt = (it.perTask||[]).find(p => p.taskId === task.id);
      if(!pt){
        return { taskIndex: idx, answered: false };
      }
      const status = statusForAnswer(task, pt.finalNodeId);
      return {
        taskIndex: idx,
        answered: true,
        theirLabel: pt.finalLabelPath || '(sin respuesta)',
        correctTokenPath: task.correctNodeId ? tokenPathForNode(task.correctNodeId) : '—',
        status,
        durationMs: pt.durationMs, clicks: pt.clicks, backtracks: pt.backtracks,
      };
    });
    const answeredRows = rows.filter(r => r.answered);
    const successCount = answeredRows.filter(r => r.status === 'correct').length;
    return {
      id: it.id,
      label: map[it.id],
      submittedAt: it.submittedAt,
      total: answeredRows.length,
      successCount,
      successRate: answeredRows.length ? successCount/answeredRows.length : 0,
      rows,
    };
  });
}

    else html = renderResultsTab();
  }else{
    // home / flujo de participante por defecto — no hay pantalla de selección de rol
    if(!state.configLoaded){ html = `<div class="card"><p class="muted">Cargando ejercicio…</p></div>`; }
    else if(!state.test) html = renderHomeScreen();
    else if(state.test.done) html = renderTestDone();
    else html = renderTestTask();
  }

  if(state.showJsonModal){
    const items = state.resultsState.items;
    html += `
    <div class="modal-backdrop" data-action="close-modal">
      <div class="modal" onclick="event.stopPropagation()">
        <h2 style="margin-bottom:10px;">Resultados en JSON</h2>
        <p class="muted" style="margin-bottom:10px;">Seleccioná todo el texto y copialo para analizarlo en otra herramienta.</p>
        <textarea class="json-box" readonly>${escapeHtml(JSON.stringify(items, null, 2))}</textarea>
        <div style="margin-top:12px;text-align:right;"><button class="btn" data-action="close-modal">Cerrar</button></div>
      </div>
    </div>`;
  }

  if(state.confirmDialog){
    html += `
    <div class="modal-backdrop">
      <div class="modal" style="max-width:420px;" onclick="event.stopPropagation()">
        <h2 style="margin-bottom:10px;">Confirmar</h2>
        <p class="muted" style="margin-bottom:18px;">${escapeHtml(state.confirmDialog.message)}</p>
        <div style="display:flex;justify-content:flex-end;gap:8px;">
          <button class="btn btn-ghost" data-action="confirm-dialog-no">Cancelar</button>
          <button class="btn btn-primary" data-action="confirm-dialog-yes" style="background:var(--error);border-color:var(--error);">Sí, continuar</button>
        </div>
      </div>
    </div>`;
  }

  if(state.toast){
    const isError = state.toast.kind === 'error';
    html += `
    <div style="position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:60;max-width:90vw;">
      <div style="background:${isError?'var(--error)':'var(--ink)'};color:#fff;padding:12px 16px;border-radius:10px;box-shadow:var(--shadow);display:flex;align-items:center;gap:12px;font-size:13.5px;">
        <span>${escapeHtml(state.toast.text)}</span>
        <button data-action="dismiss-toast" style="background:transparent;border:none;color:#fff;opacity:.7;cursor:pointer;font-size:13px;">Cerrar</button>
      </div>
    </div>`;
  }

  app.innerHTML = html;
  bindEvents();
}

/* ============================= BINDING DE EVENTOS ============================= */
function bindEvents(){
  const app = document.getElementById('app');

  const adminCodeInput = document.getElementById('admin-code');
  if(adminCodeInput){
    adminCodeInput.addEventListener('keydown', (e) => {
      if(e.key === 'Enter'){
        e.preventDefault();
        app.querySelector('[data-action="admin-gate-submit"]')?.click();
      }
    });
  }

  app.querySelectorAll('[data-action]').forEach(el => {
    el.addEventListener('click', async (e) => {
      const action = el.getAttribute('data-action');
      const nodeId = el.getAttribute('data-node-id');
      const taskId = el.getAttribute('data-task-id');

      if(action === 'go-admin'){ state.adminGate.open = true; state.adminGate.error = null; render(); const inp=document.getElementById('admin-code'); if(inp) inp.focus(); }
      else if(action === 'admin-gate-cancel'){ state.adminGate.open = false; state.adminGate.error = null; render(); }
      else if(action === 'admin-gate-submit'){
        const inp = document.getElementById('admin-code');
        const val = inp ? inp.value : '';
        if(val === ADMIN_ACCESS_CODE){
          state.adminGate.open = false; state.adminGate.error = null;
          state.role='admin'; render(); await ensureConfigLoaded(); render();
          ensureResultsLoaded();
        }else{
          state.adminGate.error = 'Código incorrecto. Probá de nuevo.';
          render();
          const inp2=document.getElementById('admin-code'); if(inp2) inp2.focus();
        }
      }
      else if(action === 'go-home'){ state.role=null; state.test=null; render(); }
      else if(action === 'tab-tree'){ state.adminTab='tree'; render(); }
      else if(action === 'tab-tasks'){ state.adminTab='tasks'; render(); }
      else if(action === 'tab-results'){ state.adminTab='results'; render(); ensureResultsLoaded(); }
      else if(action === 'refresh-results'){ ensureResultsLoaded(true); }
      else if(action === 'toggle-participant'){
        const pid = el.getAttribute('data-participant-id');
        state.participantAccordion[pid] = !state.participantAccordion[pid];
        render();
      }
      else if(action === 'clear-results'){
        askConfirm('Esto borra TODAS las respuestas guardadas de participantes de forma permanente, para poder arrancar de nuevo. ¿Confirmás?', 'do-clear-results');
      }
      else if(action === 'confirm-dialog-yes'){
        const pending = state.confirmDialog ? state.confirmDialog.actionOnYes : null;
        state.confirmDialog = null;
        render();
        if(pending === 'do-clear-results'){
          const result = await clearAllResults();
          const fresh = await loadAllResults();
          state.resultsState.items = fresh;
          state.resultsState.loaded = true;
          render();
          if(result.ok){ showToast('Resultados eliminados. La sección quedó vacía, lista para empezar de nuevo.', 'ok'); }
          else{ showToast('No se pudieron borrar todos los resultados (quedaron '+result.remaining+'). Probá de nuevo o usá "Actualizar".', 'error'); }
        }else if(pending === 'do-reset-tree'){
          state.config.tree = defaultTree();
          render(); persistConfig();
        }
      }
      else if(action === 'confirm-dialog-no'){ state.confirmDialog = null; render(); }
      else if(action === 'dismiss-toast'){ state.toast = null; render(); }
      else if(action === 'export-json'){ state.showJsonModal=true; render(); }
      else if(action === 'close-modal'){ state.showJsonModal=false; render(); }

      else if(action === 'add-root'){
        state.config.tree.push({ id: uid(), label:'Nueva categoría', children:[] });
        render(); persistConfig();
      }
      else if(action === 'add-child'){
        const p = findNode(state.config.tree, nodeId);
        if(p){ p[p.length-1].children.push({ id: uid(), label:'Nuevo nivel', children:[] }); }
        render(); persistConfig();
      }
      else if(action === 'delete-node'){
        removeNode(state.config.tree, nodeId);
        render(); persistConfig();
      }
      else if(action === 'reset-tree'){
        askConfirm('Esto reemplaza el árbol actual por la nomenclatura completa del archivo "Colors" de Figma (background + text-icon). ¿Continuar?', 'do-reset-tree');
      }
      else if(action === 'add-task'){
        state.config.tasks.push({ id: uid(), prompt:'', hex:'', correctNodeId:'' });
        render(); persistConfig();
      }
      else if(action === 'delete-task'){
        state.config.tasks = state.config.tasks.filter(t => t.id !== taskId);
        render(); persistConfig();
      }

      else if(action === 'begin-test'){
        const nameInput = document.getElementById('pname');
        startTest(nameInput ? nameInput.value : '');
      }
      else if(action === 'drill'){ drillInto(nodeId); }
      else if(action === 'go-back'){ goBack(); }
      else if(action === 'confirm-answer'){ confirmAnswer(); }
    });
  });

  // inputs de texto: no re-renderizar en cada tecla (perdería el foco), guardar en 'change' (blur)
  app.querySelectorAll('input[data-field], textarea[data-field]').forEach(el => {
    el.addEventListener('change', () => {
      const field = el.getAttribute('data-field');
      const nodeId = el.getAttribute('data-node-id');
      const taskId = el.getAttribute('data-task-id');
      if(nodeId){
        const p = findNode(state.config.tree, nodeId);
        if(p) p[p.length-1][field] = el.value;
      }else if(taskId){
        const task = state.config.tasks.find(t => t.id === taskId);
        if(task) task[field] = el.value;
      }
      persistConfig();
    });
  });
  app.querySelectorAll('select[data-field]').forEach(el => {
    el.addEventListener('change', () => {
      const taskId = el.getAttribute('data-task-id');
      const task = state.config.tasks.find(t => t.id === taskId);
      if(task) task.correctNodeId = el.value;
      persistConfig();
      render();
    });
  });
}

function removeNode(tree, id){
  for(let i=0;i<tree.length;i++){
    if(tree[i].id === id){ tree.splice(i,1); return true; }
    if(tree[i].children && removeNode(tree[i].children, id)) return true;
  }
  return false;
}

/* ============================= INIT ============================= */
render();
ensureConfigLoaded().then(render);
</script>
</body>
</html>
